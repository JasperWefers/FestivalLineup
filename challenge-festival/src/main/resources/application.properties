spring.application.name=festival-lineup
# Spring Boot 4 (Jackson 3) weigert standaard een ontbrekende double/int/boolean in de JSON.
# Uitgezet zodat @Valid de fout netjes kan melden.
spring.jackson.deserialization.fail-on-null-for-primitives=false
server.port=8083
# Toon de boodschap van een exception in de foutbody (voor de 409)
server.error.include-message=always
